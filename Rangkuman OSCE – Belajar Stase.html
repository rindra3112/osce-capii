<script>
const $=s=>document.querySelector(s),dlg=$('#dlg'),app=$('#app');
const EDU='Jelaskan penyakit pasien; cara pakai obat beserta jedanya (dioleskan, bukan langsung dari tube); cuci tangan sebelum & sesudah pakai obat; kontrol mata rutin.';
const A='Mata merah visus turun',B='Mata merah visus tetap',C='Mata tenang visus turun perlahan',F='Lain-lain (adneksa)';
const EYE={id:'mata',nama:'OSCE Mata',deskripsi:'Kompilasi 27 kasus stase Ilmu Kesehatan Mata — anamnesis, pemeriksaan, diagnosis banding, terapi & resep, hingga edukasi.',kasus:[]};
const D=[
['Herpes Simpleks Keratitis',A,'Keradangan kornea karena virus herpes simpleks.','Mata merah, fotofobia, epifora, penglihatan menurun, kabur, berair, silau; lebih suka ruang gelap. RPD: pernah herpes di bagian lain (ex mulut).','Visus menurun; palpebra lepuhan folikuler; kornea: sensibilitas turun, keratitis punctata difusa, dendritic ulcer; BMD/pupil/iris baik.\nPreaurikular: limfadenopati. Fluoresein: dendritic ulcer (+). Scrapping & Giemsa: multinucleated giant cell. Sensibilitas kornea menurun. Tzanck smear (+).','Keratitis bakterial, keratitis jamur, ulkus kornea','R/ Acyclovir ophthalmic ointment 3% tube No. I S 5 dd ue 1 OD/OS/ODS\nRUJUK: keratoplasti (untuk menghilangkan virus di kornea)',EDU+' Jangan berbagi handuk.','R/ Acyclovir ophthalmic ointment 3% tube No. I\nS 5 dd ue 1 OD/OS/ODS',['acyclovir|asiklovir','ointment|salep|\\bue\\b','5 ?dd']],
['Keratitis',A,'Keradangan kornea.','Mata merah, nyeri, fotofobia, epifora, penglihatan menurun, kabur, berair, silau. Faktor risiko: bakteri (higiene buruk, imunokompromais), jamur (tergores tanaman/ekor hewan), virus (imunokompromais), Acanthamoeba (lensa kontak, renang).','Visus menurun; palpebra edema; konjungtiva hiperemi. Kornea: Pseudomonas (mukopurulen, hijau, hipopion); Streptococcus (abu-abu, putih, kuning); jamur (infiltrat putih tepi berbulu); Acanthamoeba (ring infiltrate). BMD hipopion (-/+); pupil/iris DBN. Fluoresein (+); Seidel (-/+); scrapping gram & Giemsa; KOH; Calcofluor white.','Bakteri, jamur, Acanthamoeba, virus','1. Bakteri: R/ Levofloxacin 0,5% ED No. I S 6 dd gtt 1 OD/OS/ODS\n2. Jamur: R/ Natamycin 5% ED fls No. I S 6 dd gtt 1 (Aspergillus); Amphotericin B 0,15% ED fls No. I S 1 dd gtt 1 o.h 48 jam (Candida)\n3. Acanthamoeba: R/ Chlorhexidine 0,02% ED fls No. I S gtt 1 o.h OD/OS/ODS 2-3 hari',EDU+' Jangan berbagi handuk.','R/ Levofloxacin 0,5% ED No. I S 6 dd gtt 1 OD/OS/ODS (bakteri)\nR/ Natamycin 5% ED fls No. I S 6 dd gtt 1 (jamur)\nR/ Chlorhexidine 0,02% ED fls No. I S gtt 1 o.h (Acanthamoeba)',['levofloxacin|levofloksasin','natamycin|amphotericin','chlorhexidine|klorheksidin']],
['Ulkus Kornea',A,'Hilangnya sebagian kornea karena keradangan.','Mata merah, fotofobia, epifora, penglihatan menurun, kabur, berair, silau, nyeri hebat.','Visus menurun; palpebra DBN; konjungtiva hiperemi; kornea ulkus (+), infiltrat (+), hipopion (+); BMD/iris/pupil DBN; fluoresein (+); Seidel (+).','Keratitis, uveitis anterior','R/ Levofloxacin 0,5% ED No. I S 6 dd gtt 1 OD/OS/ODS',EDU,'R/ Levofloxacin 0,5% ED No. I\nS 6 dd gtt 1 OD/OS/ODS',['levofloxacin|levofloksasin','6 ?dd']],
['Uveitis Anterior',A,'Keradangan di iris, badan siliaris, dan bilik mata depan.','Mata merah dan nyeri, epifora, fotofobia, blefarospasme; kabur perlahan, nrocos, silau, nyeri ngilu pada malam hari. RPD: rematik, autoimun, SLE.','Visus menurun; konjungtiva hiperemi perikorneal, kemosis; kornea edema, keratic precipitate; BMD aqueous cell, flare, hipopion; iris edema, pucat, sinekia posterior, Koeppe nodule, Busacca nodule; pupil miosis, irreguler, tertutup eksudat; TIO normal; fluoresein tidak ada (lesi di endotel).','Konjungtivitis akut, glaukoma akut','Non-medikamentosa: kompres hangat, kacamata hitam.\nR/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS\nR/ Prednisolone acetate 1% ED fl. No. I S 4 dd gtt 1 OD/OS/ODS',EDU,'R/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS\nR/ Prednisolone acetate 1% ED fl. No. I S 4 dd gtt 1 OD/OS/ODS',['atropin|atropine','prednisolone|prednisolon']],
['Trauma Asam/Basa',A,'Rudapaksa mata akibat bahan kimia asam atau basa.','Mata merah, nyeri, buram, silau; terkena percikan bahan kimia, perih, sulit membuka mata, mengganjal. RSE: tidak memakai kacamata kerja.','Visus menurun; palpebra edema hiperemi; konjungtiva hiperemi, kemosis; kornea edema keruh; BMD/iris/pupil DBN; kertas lakmus: pH tergantung zat; TIO naik/turun; slit lamp: cek segmen anterior.','Trauma asam, trauma basa, trauma benda tumpul, keratitis, uveitis anterior','1. Anestesi lokal\n2. Irigasi untuk menghilangkan kontak\n3. Irigasi NaCl 0,9% minimal 1 L/mata: asam 30 menit, basa 1 jam\n4. Cek pH (normal 7,3)\n5. Irigasi lagi, cek pH tiap 15 menit bila belum normal\n6. Nilai visus\n7. RUJUK\nR/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS\nR/ Chloramphenicol 0,5% ED fl. No. I S 4 dd gtt 1 OD/OS/ODS',EDU+' Gunakan alat pelindung mata saat bekerja dengan bahan kimia. Prognosis bergantung jenis bahan, lama kontak, kecepatan irigasi, dan derajat kerusakan kornea serta limbus.','R/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS\nR/ Chloramphenicol 0,5% ED fl. No. I S 4 dd gtt 1 OD/OS/ODS',['atropin|atropine','chloramphenicol|kloramfenikol']],
['Hifema Traumatik dengan Glaukoma Sekunder',A,'Akumulasi darah di bilik mata depan akibat trauma.','Mata merah, nyeri, kabur, silau; terkena bola kasti, ada bayangan merah/gelap, mual, muntah. RSE: pemain kasti.','Visus menurun jika hifema > setengah BMD; palpebra edema; konjungtiva hiperemi perikorneal; kornea abrasi (-/+); BMD hifema (staging perdarahan); iris iridoplegia, iridodialisis; pupil normal/lonjong; TIO naik.','Kontusio bulbi, abrasi kornea, trauma kimia','Non-medikamentosa: bed rest, head up 30 derajat, eye patch.\nR/ Paracetamol tab 500 mg No. X S 3 dd 1 tab p.c.\nR/ Asam traneksamat 500 mg tab No. IX S 3 dd tab I\nR/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS\nR/ Asetazolamid 250 mg tab No. XXI S 3 dd tab I\nRUJUK',EDU+' Batasi aktivitas, tidak mengangkat beban berat, hindari mengucek mata, gunakan pelindung mata.','R/ Paracetamol tab 500 mg No. X S 3 dd 1 tab p.c.\nR/ Asam traneksamat 500 mg tab No. IX S 3 dd tab I\nR/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1\nR/ Asetazolamid 250 mg tab No. XXI S 3 dd tab I',['paracetamol','traneksamat|tranexamic','atropin|atropine','asetazolamid|acetazolamide']],
['Glaukoma Akut Sudut Tertutup',A,'Tertutupnya sudut BMD akibat peningkatan TIO secara cepat.','Mata merah, nyeri mendadak, mual, muntah, silau, pandangan tiba-tiba menyempit seperti terowongan. RPK: orang tua/saudara (+).','Visus menurun, halo sign; palpebra edema; konjungtiva injeksi silier, kemosis; kornea edema keruh; BMD dangkal, sudut tertutup; iris bombans; pupil midriasis, refleks (-); TIO naik; OCT: pilih grade 1-4.','','Non-medikamentosa: posisi supine.\nR/ Inj. Acetazolamide 500 mg No. I S per IV (TIO >50 mmHg)\nDAN R/ Timolol maleate 0,5% ED fl. No. I S 2 dd gtt I OD\nDAN R/ Prednisolone acetate 1% ED fl. No. I S 4 dd gtt 1 OD/OS/ODS\nLALU (TIO <40 mmHg) R/ Pilocarpine 2% ED fl. No. I S 4 dd gtt I OD/OS/ODS\nRUJUK: iridotomi / iridektomi','Jelaskan penyakit pasien; batasi aktivitas; tidak mengangkat beban berat; kontrol mata rutin.','R/ Inj. Acetazolamide 500 mg No. I S per IV\nR/ Timolol maleate 0,5% ED fl. No. I S 2 dd gtt I OD\nR/ Prednisolone acetate 1% ED fl. No. I S 4 dd gtt 1\nR/ Pilocarpine 2% ED fl. No. I S 4 dd gtt I (setelah TIO <40)',['acetazolamide|asetazolamid','timolol','prednisolone|prednisolon','pilocarpine|pilokarpin']],

['Panoftalmitis',A,'Inflamasi seluruh bola mata sampai orbita.','','','Endoftalmitis','R/ Vancomycin 1 mg/0,1 mL inj. No. I S inj. intravitreal\nDAN R/ Ceftazidime 2,25 mg/0,1 mL inj. No. I S inj. intravitreal\nDAN R/ Dexamethasone sodium phosphate 0,1% ED fl. No. I S 4 dd gtt I OD','','R/ Vancomycin 1 mg/0,1 mL inj. No. I S inj. intravitreal\nR/ Ceftazidime 2,25 mg/0,1 mL inj. No. I S inj. intravitreal\nR/ Dexamethasone sod. phosphate 0,1% ED fl. No. I S 4 dd gtt I OD',['vancomycin','ceftazidime','dexamethasone|deksametason','intravitreal']],
['Subkonjungtiva Bleeding',B,'Perdarahan akibat pecahnya pembuluh darah antara konjungtiva dan sklera.','Mata merah, mengganjal, tidak nyaman; terjadi sehabis menyelam. RPK/RPO: operasi (-/+), memakai warfarin (-/+).','Visus normal; konjungtiva hiperemi; segmen lain DBN.','Konjungtivitis akut','Tidak perlu pengobatan (self-limiting 1-2 minggu); kompres dingin 24 jam pertama (cegah perluasan); kompres hangat setelah 24 jam; reassurance.\nR/ Occufresh ED fl. No. I S 4 dd gtt 1 OD/OS/ODS','Kondisi umumnya tidak berbahaya, sembuh sendiri 1-2 minggu; hindari mengucek mata; tidak mengangkat beban berat/mengejan; kontrol hipertensi bila ada; '+EDU,'R/ Occufresh ED fl. No. I\nS 4 dd gtt 1 OD/OS/ODS',['occufresh|artificial tears|air mata buatan','4 ?dd']],
['Xeroftalmia',B,'Gangguan akibat kekurangan vitamin A.','Sulit melihat pada cahaya redup, mata kering, sakit.','Visus menurun saat gelap. Konjungtiva: X1A metaplasia keratinisasi, X1B bercak Bitot (foamy/cheesy). Kornea: X2 berkabut tidak bercahaya, X3A ulkus <1/3, X3B ulkus >1/3, XS putih & sikatrik. Funduskopi: XF seperti cendol. Tes adaptasi gelap (+).','','Terapi gizi; vitamin A (<6 bln 50.000 IU; <1 th 1 kapsul biru 100.000 IU; 1-5 th 1 kapsul merah 200.000 IU).\nX1A: R/ Hydroxypropyl methylcellulose 0,7% ED fl. No. I S 6 dd gtt I\nX2, X3, X3B: R/ Chloramphenicol 0,5% ED fl. No. I S 6 dd gtt 1 OD/OS/ODS DAN R/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1 OD/OS/ODS','Jelaskan penyakit pasien; penyuluhan keluarga untuk meningkatkan konsumsi vitamin A; ASI eksklusif.','R/ Hydroxypropyl methylcellulose 0,7% ED fl. No. I S 6 dd gtt I (X1A)\nR/ Chloramphenicol 0,5% ED fl. No. I S 6 dd gtt 1 (X2/X3)\nR/ Sulfas atropin 1% ED fl. No. I S 3 dd gtt 1',['hydroxypropyl|hipromelosa|hpmc','chloramphenicol|kloramfenikol','atropin|atropine']],
['Trachoma',B,'Keratokonjungtivitis akibat Chlamydia.','','Visus normal; palpebra hiperemi, folikel/papil, trikiasis/entropion (-/+); kornea pannus; BMD/iris/pupil DBN.','','R/ Azitromisin 500 mg tab No. I S 1 dd 1 single dose\nR/ Tetrasiklin 1% ophthalmic ointment tube No. I S 2 dd ue 1 OD/OS/ODS','Jelaskan penyakit; obati seluruh keluarga; jangan berbagi handuk; cuci muka rutin; kontrol mata rutin.','R/ Azitromisin 500 mg tab No. I S 1 dd 1 single dose\nR/ Tetrasiklin 1% ophthalmic ointment tube No. I S 2 dd ue 1 OD/OS/ODS',['azitromisin|azithromycin','tetrasiklin|tetracycline']],
['Keratokonjungtivitis Sicca',B,'Keringnya permukaan kornea dan konjungtiva.','Mata kering, gatal, merah, perih, silau, kadang berair, setelah bekerja di depan laptop. RPD: operasi mata, Sjogren, sklerosis; lensa kontak. RSE: menopause, komputer lama.','Visus normal; konjungtiva hiperemi, kering; kornea kering; Schirmer test (+) <10 mm.','','Non-medikamentosa: kompres hangat, aturan 20-20-20.\nR/ Occufresh ED fl. No. I S 4 dd gtt 1 OD/OS/ODS','Jelaskan penyakit; aturan 20-20-20: setiap 20 menit lihat benda sejauh 20 kaki selama 20 detik.','R/ Occufresh ED fl. No. I\nS 4 dd gtt 1 OD/OS/ODS',['occufresh|artificial tears|air mata buatan','4 ?dd']],
['Episkleritis',B,'Inflamasi di episklera (lapisan: konjungtiva, episklera, tenon, sklera).','Mata merah pink, kadang nyeri; setelah makan udang, tidak ada sekret. RPD: RA (-/+).','Visus normal; konjungtiva & episklera hiperemi; tes fenilefrin (+) memucat.','Skleritis','Self-limiting; kompres dingin.\nR/ Occufresh ED fl. No. I S 4 dd gtt 1 OD/OS/ODS','',  'R/ Occufresh ED fl. No. I\nS 4 dd gtt 1 OD/OS/ODS',['occufresh|artificial tears|air mata buatan','4 ?dd']],
['Skleritis',B,'Inflamasi di sklera.','Mata merah kebiruan, nyeri saat bergerak, silau; nyeri menjalar ke kepala sisi yang terkena. RPD: RA (-/+).','Visus normal; konjungtiva & episklera hiperemi; tes fenilefrin (-) tidak memucat.','Episkleritis','R/ Ketorolac tromethamine 0,5% ED fl. No. I S 4 dd gtt I OD','','R/ Ketorolac tromethamine 0,5% ED fl. No. I\nS 4 dd gtt I OD',['ketorolac','4 ?dd']],
['Pterygium',B,'Penebalan konjungtiva bulbi berbentuk segitiga ke arah kornea.','Mata merah, mengganjal saat berkedip, tampak daging tumbuh di mata, mata kering. RPK: ibu (+). RSE: petani, nelayan.','Visus normal (grade 4 turun); konjungtiva hiperemi; kornea DBN kecuali grade 4 (jaringan fibrovaskular); probe/sonde test (-); slit lamp: grading.','Pseudopterygium, pinguecula, keratitis marginal','Non-farmakologi: kacamata anti UV, topi.\nR/ Occufresh ED fl. No. I S 4 dd gtt 1 OD/OS/ODS\nRUJUK: eksisi pterygium berdasarkan indikasi','Hindari paparan UV, debu, angin; pakai kacamata anti UV & topi di luar; kekambuhan bisa terjadi walau sudah operasi; '+EDU,'R/ Occufresh ED fl. No. I\nS 4 dd gtt 1 OD/OS/ODS',['occufresh|artificial tears|air mata buatan','4 ?dd']],
['Konjungtivitis',B,'Infeksi pada konjungtiva.','Mata merah, ngeres, sulit dibuka, ada cairan (jernih encer, mukoid, mukopurulen, purulen), sulit membuka mata saat bangun tidur. Faringitis/common cold (virus); riwayat alergi (alergi); lensa kontak, berbagi handuk.','Visus normal; palpebra edema, hiperemi; konjungtiva injeksi + sekret: virus jernih encer, folikel, gatal; alergi serous, papil; vernal serous, papil raksasa, Horner-Trantas dot; bakteri/klamidia mukopurulen, Herbert pits; gonore purulen. Swab Giemsa, metilen blue, kerokan konjungtiva: eosinofil (+).','','1. Bakteri: R/ Chloramphenicol 0,5% ED fl. No. I S 6 dd gtt 1 OD/OS/ODS 3 hari ATAU Chloramphenicol 1% eye ointment tube No. I S 3 dd ue 1 3 hari\n2. Gonore: Chloramphenicol 0,5% ED 1 gtt o.h 2 hari + R/ Inj. Ceftriaxon 1 g No. I S per IV + R/ Azithromycin tab 500 mg No. II S 1 dd 2 tab single dose\n3. Klamidia: R/ Oxytetrasiklin 1% eye ointment No. I S 4 dd ue 1 3 minggu + Azithromycin 500 mg No. II single dose\n4. Alergi: R/ Sodium kromoglikat 2% ED fl. No. I S 4 dd gtt I ODS (stabilizer sel mast) + R/ Cetirizine 10 mg tab No. X S 1 dd tab I p.o.; jika berat R/ Fluorometholone 0,1% ED fl. No. I S 2 dd gtt I\n5. Virus: R/ Artificial tears ED fl. No. I S 6 dd gtt 1 OD/OS/ODS','Jaga kebersihan tangan; jangan berbagi handuk; jangan mengucek mata; hindari alergen; '+EDU,'R/ Chloramphenicol 0,5% ED fl. No. I S 6 dd gtt 1 OD/OS/ODS 3 hari (bakteri)\nR/ Sodium kromoglikat 2% ED fl. No. I S 4 dd gtt I ODS (alergi)\nR/ Artificial tears ED fl. No. I S 6 dd gtt 1 (virus)',['chloramphenicol|kloramfenikol|kromoglikat|cromoglicate|cetirizine|artificial tears|azithromycin|oxytetrasiklin','gtt|tetes|ue|salep|tab']],
['Korpus Alienum',B,'Masuknya benda asing ke konjungtiva yang dapat menyebabkan iritasi.','Mata merah, nyeri, silau; mata kemasukan benda, ada benda asing. RSE: tidak memakai alat pelindung mata.','Visus normal; konjungtiva hiperemi, korpal (-/+); kornea korpal (-/+); fluoresein: kekeruhan (-/+); slit lamp: evaluasi letak korpal.','Benda asing kornea, benda asing konjungtiva, konjungtivitis akut','1. Eversi kelopak mata\n2. Anestesi lokal\n3. Irigasi\n4. Gunakan slit lamp\n5. Angkat korpal dengan lidi/spuit 1 cc 26G dibubuhi povidone iodine\n6. Angkat menjauhi kornea\nEye patch\nR/ Chloramphenicol 0,5% ED fl. No. I S 12 dd gtt 1 OD/OS/ODS 2 hari','Jangan mengucek mata; gunakan kacamata pelindung saat bekerja dan berkendara; kontrol mata rutin.','R/ Chloramphenicol 0,5% ED fl. No. I\nS 12 dd gtt 1 OD/OS/ODS selama 2 hari',['chloramphenicol|kloramfenikol','12 ?dd']],
['Katarak',C,'Kekeruhan pada lensa.','Pandangan buram, silau, seperti melihat kabut, lebih nyaman membaca malam hari. RPD: diabetes (-/+). RSE: paparan UV, merokok.','Visus turun; lensa keruh; shadow test (-/+); leukokoria; refleks fundus (-); pinhole tetap; TIO naik/turun; USG: nilai retroorbital; slit lamp: evaluasi luas, tebal, kekeruhan, kekerasan.','Katarak komplikata, katarak traumatik, ablasi retina, kelainan refraksi, glaukoma, AMD','Lensa kacamata yang sesuai.\nRUJUK: operasi katarak','Jelaskan penyakit; katarak tidak hilang dengan obat/tetes mata; terapi definitif adalah operasi bila mengganggu aktivitas; kontrol penyakit penyerta (DM, hipertensi); berhenti merokok; kontrol mata berkala.','',''],
['Glaukoma Kronis Sudut Terbuka',C,'Kerusakan nervus optikus.','Penurunan penglihatan, pusing, pandangan berubah seperti terowongan. RPD: DM, miopia. RPO: steroid. RSE: usia >40 tahun.','Visus menurun, tunnel vision; BMD tidak dangkal; TIO normal; funduskopi: cupping, bayoneting; gonioskopi: melihat sudut.','','R/ Timolol maleate 0,5% ED fl. No. I S 2 dd gtt I OD/OS/ODS\nDAN R/ Pilocarpine 2% ED fl. No. I S 4 dd gtt I OD/OS/ODS\nDAN R/ Latanoprost 0,005% ED fl. No. I S 1 dd gtt I OD/OS/ODS\nDAN R/ Asetazolamid tab 250 mg No. XII S 3 dd 1 tab','Jelaskan penyakit; kontrol mata rutin.','R/ Timolol maleate 0,5% ED fl. No. I S 2 dd gtt I\nR/ Pilocarpine 2% ED fl. No. I S 4 dd gtt I\nR/ Latanoprost 0,005% ED fl. No. I S 1 dd gtt I\nR/ Asetazolamid tab 250 mg No. XII S 3 dd 1 tab',['timolol','pilocarpine|pilokarpin','latanoprost','asetazolamid|acetazolamide']],
['Miopia',C,'Rabun jauh.','Kabur melihat jauh, makin dekat makin jelas, pusing, nyeri kepala, memicingkan mata. RPK: orang tua, kakak (+). RSE: main HP lama, nonton TV dekat, jarang di ruang terbuka.','Visus menurun; segmen anterior DBN; Snellen chart jarak 6 m; pinhole: bila maju berarti kelainan refraksi; autorefraktometer sesuai.','Katarak, astigmatisme, ambliopia','Balita: tidak dikoreksi; prasekolah: observasi 6 bulan; usia sekolah: >1D dikoreksi; dewasa: koreksi sesuai.\nKacamata: lensa sferis negatif terkecil yang memberi visus terbaik.','Istirahat membaca/aktivitas dekat tiap 30 menit; posisi duduk tegak; penerangan cukup; menonton TV jarak 6 kaki dan batasi waktu; olahraga teratur; kontrol 1 tahun sekali (anak 6 bulan sekali).','',''],
['Astigmatisme',C,'Perbedaan pembiasan pada tiap meridian.','Pandangan kabur, cahaya malam tampak ganda, nyeri kepala, mata lelah. RPK: orang tua, kakak (+). RSE: main HP lama.','Visus menurun, kabur; segmen anterior DBN; Snellen 6 m; pinhole; autorefraktometer; astigmatic fan test: lihat garis paling tebal setelah ditambah +20/+50.','Katarak, kelainan refraksi','Lensa silindris.','Istirahat membaca/aktivitas dekat tiap 30 menit; posisi duduk tegak; penerangan cukup; TV jarak 6 kaki; olahraga teratur; kontrol 1 tahun sekali (anak 6 bulan sekali).','',''],
